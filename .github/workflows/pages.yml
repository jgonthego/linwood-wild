name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 * *"   # monthly data refresh from iNaturalist (1st of month)
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh possible-species data from GBIF + iNaturalist (keeps committed data on failure)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 60
        env:
          HOME_LAT: ${{ secrets.HOME_LAT }}
          HOME_LNG: ${{ secrets.HOME_LNG }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null || true
          if [ -z "$HOME_LAT" ]; then echo "HOME_LAT secret missing; keeping committed data"; exit 0; fi
          python scripts/fetch_possible.py || git checkout -- data/species.json
          python scripts/fetch_sounds.py || git checkout -- data/sounds.json audio
      - name: Galleries + Wikipedia text + bird traits for any new species (incremental; keeps committed data on failure)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 40
        run: |
          # committed data/gallery.json, data/wiki_desc.json and data/traits_curated.txt persist; only species new this month are fetched
          python scripts/fetch_gallery.py --budget 1500 || git checkout -- data/gallery.json
          python scripts/fetch_wiki.py || git checkout -- data/wiki_desc.json
          python scripts/build_traits.py || git checkout -- data/traits.json
      - name: Build
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
